name: Flutter CI - Visual Testing & Web Preview

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  FLUTTER_VERSION: '3.19.0'
  JAVA_VERSION: '17'

jobs:
  # Job 1: Test and Screenshot Capture
  test_and_screenshot:
    name: Integration Tests & Screenshot Capture
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: |
          flutter --version
          flutter doctor -v

      - name: Configure Git for Flutter
        run: |
          git config --global --add safe.directory /opt/hostedtoolcache/flutter
      - name: Debug Working Directory
        run: |
          echo "Current directory:"
          pwd
          echo "List files:"
          ls -la
      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Analyze Code Quality
        run: flutter analyze
        continue-on-error: false

      - name: Run Unit Tests
        run: flutter test --coverage
        continue-on-error: false

      - name: Setup Chrome Driver for Integration Tests
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver xvfb

      - name: Create Screenshots Directory
        run: mkdir -p screenshots

      - name: Start Virtual Display
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
          sleep 3

      - name: Run Integration Tests with Screenshots
        run: |
          export DISPLAY=:99
          flutter test integration_test/app_test.dart \
            --dart-define=SCREENSHOT_MODE=true \
            --driver=test_driver/integration_test.dart
        continue-on-error: false

      - name: Verify Screenshots Generated
        run: |
          echo "Screenshot files generated:"
          ls -lh screenshots/
          file_count=$(ls -1 screenshots/*.png 2>/dev/null | wc -l)
          echo "Total screenshots: $file_count"
          if [ $file_count -eq 0 ]; then
            echo "Warning: No screenshots were generated"
          fi

      - name: Upload Screenshots as Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-screenshots-${{ github.run_number }}
          path: screenshots/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ github.run_number }}
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

      - name: Generate Test Summary
        if: always()
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Flutter Version**: ${{ env.FLUTTER_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Run Number**: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d "screenshots" ]; then
            screenshot_count=$(ls -1 screenshots/*.png 2>/dev/null | wc -l)
            echo "- **Screenshots Captured**: $screenshot_count" >> $GITHUB_STEP_SUMMARY
          fi

  # Job 2: Build and Deploy Web Preview
  build_web_preview:
    name: Build Flutter Web & Deploy Preview
    runs-on: ubuntu-latest
    needs: test_and_screenshot
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    timeout-minutes: 20
    
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Enable Flutter Web
        run: flutter config --enable-web

      - name: Build Flutter Web Release
        run: |
          flutter build web \
            --release \
            --web-renderer html \
            --base-href /${{ github.event.repository.name }}/ \
            --dart-define=FLUTTER_WEB_USE_SKIA=false

      - name: Add 404 Redirect for SPA
        run: |
          cp build/web/index.html build/web/404.html

      - name: Create Web Build Info
        run: |
          cat > build/web/build-info.json << EOF
          {
            "build_number": "${{ github.run_number }}",
            "commit_sha": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "build_time": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "flutter_version": "${{ env.FLUTTER_VERSION }}",
            "workflow": "${{ github.workflow }}"
          }
          EOF

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ github.run_number }}
          path: build/web/
          retention-days: 7

      - name: Deploy to GitHub Pages (Main/Develop Only)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy web preview from ${{ github.ref_name }} - Run #${{ github.run_number }}'

      - name: Generate Deployment Summary
        if: always()
        run: |
          echo "## Web Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Status**: ✅ Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Number**: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" == "push" ] && ([ "${{ github.ref }}" == "refs/heads/main" ] || [ "${{ github.ref }}" == "refs/heads/develop" ]); then
            echo "### 🚀 Deployment Information" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Preview URL**: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> Web preview will be available in 2-3 minutes after deployment completes." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ℹ️ Note" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Web build completed but not deployed (PR or non-main/develop branch)" >> $GITHUB_STEP_SUMMARY
            echo "Download the web-build artifact to test locally." >> $GITHUB_STEP_SUMMARY
          fi

  # Job 3: Android Build (Optional)
  android_build:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test_and_screenshot
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --target-platform android-arm,android-arm64,android-x64

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Generate APK Build Summary
        run: |
          echo "## Android Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Status**: ✅ Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Type**: Release APK (Split per ABI)" >> $GITHUB_STEP_SUMMARY
          echo "- **Architectures**: ARM, ARM64, x64" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "APK files available in artifacts:" >> $GITHUB_STEP_SUMMARY
          ls -lh build/app/outputs/flutter-apk/*.apk | awk '{print "- " $9 " (" $5 ")"}' >> $GITHUB_STEP_SUMMARY

  # Job 4: Notification and Summary
  workflow_summary:
    name: Workflow Summary
    runs-on: ubuntu-latest
    needs: [test_and_screenshot, build_web_preview]
    if: always()

    steps:
      - name: Generate Final Summary
        run: |
          echo "# 🎉 CI/CD Pipeline Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.test_and_screenshot.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Web Build | ${{ needs.build_web_preview.result == 'success' && '✅ Passed' || needs.build_web_preview.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Quick Links" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- [View Workflow Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "- [View Artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts)" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.build_web_preview.result }}" == "success" ]; then
            echo "- [Web Preview](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/)" >> $GITHUB_STEP_SUMMARY
          fi
